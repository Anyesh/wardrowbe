apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: wardrobe
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wardrobe
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: backend
          image: wardrobe/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: wardrobe-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wardrobe-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: STORAGE_PATH
              value: "/data/uploads"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wardrobe-secrets
                  key: backend-secret-key
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wardrobe-secrets
                  key: ai-api-key
                  optional: true
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wardrobe-notifications
                  key: ntfy-token
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: wardrobe-notifications
                  key: smtp-user
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wardrobe-notifications
                  key: smtp-password
                  optional: true
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wardrobe-secrets
                  key: oidc-client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wardrobe-secrets
                  key: oidc-client-secret
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wardrobe
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
