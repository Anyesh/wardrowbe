apiVersion: v1
kind: ConfigMap
metadata:
  name: wardrobe-config
  namespace: wardrobe
# backend, worker and image-worker load every key here through envFrom, so a
# setting added below reaches all three without editing the Deployments.
data:
  # Database
  POSTGRES_USER: "wardrobe"
  POSTGRES_DB: "wardrobe"

  # URLs - Update these to match your domain
  APP_URL: "https://wardrobe.example.com"
  NEXTAUTH_URL: "https://wardrobe.example.com"

  # OIDC Provider URL (Authentik, Pocket ID, Keycloak, etc.)
  OIDC_ISSUER_URL: "https://auth.example.com"

  # Optional: separate OIDC client ID for mobile app
  # If unset, the web OIDC_CLIENT_ID is used for both
  OIDC_MOBILE_CLIENT_ID: ""

  # Private CA for the OIDC provider: mount the PEM into the pods (k8s/README.md "Private CA")
  # and set its path. OIDC_CA_BUNDLE is read by the backend, NODE_EXTRA_CA_CERTS by
  # the frontend. Empty means the system trust store only.
  OIDC_CA_BUNDLE: ""
  NODE_EXTRA_CA_CERTS: ""

  # AI Configuration
  # Use any OpenAI-compatible API (OpenAI, Ollama, LocalAI, etc.)
  AI_BASE_URL: "https://api.openai.com/v1"
  AI_VISION_MODEL: "gpt-4o"
  AI_TEXT_MODEL: "gpt-4o"
  # AI_TIMEOUT defaults to 120 seconds; slow local models often need 300-600.
  # AI_TIMEOUT: "300"
  AI_MAX_RETRIES: "3"
  # Reasoning effort for thinking-capable models. "none" because a thinking model
  # otherwise spends the whole completion budget on hidden monologue and returns
  # empty content. Leave blank to send no reasoning_effort at all.
  AI_REASONING_EFFORT: "none"
  # How many items the worker analyzes at once. One at a time because a
  # single local model serves requests serially, so N in flight multiplies
  # each request's latency by N against AI_TIMEOUT. The backend reads it too,
  # to report the configured value in the analysis queue panel.
  AI_TAGGING_CONCURRENCY: "1"

  # Capability switches. Defaults keep internal AI on. Set AI_INTERNAL_ENABLED
  # to "false" to run with no internal AI and defer to an external agent; the
  # per-capability switches inherit the master when unset.
  AI_INTERNAL_ENABLED: "true"
  AI_VISION_ENABLED: "true"
  AI_TEXT_ENABLED: "true"

  # Logging
  LOG_LEVEL: "INFO"

  # Forward-auth logout target for the frontend: TINYAUTH_URL for TinyAuth,
  # FORWARD_AUTH_LOGOUT_URL for Authelia and others. The proxy secret itself
  # lives in secrets.yaml as forward-auth-secret.
  FORWARD_AUTH_LOGOUT_URL: ""
  TINYAUTH_URL: ""

  # Optional: ntfy.sh server for push notifications
  NTFY_SERVER: ""
  NTFY_TOPIC: ""

  # Optional: email notifications (SMTP_USER/SMTP_PASSWORD live in wardrobe-notifications)
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_FROM_NAME: "Wardrowbe"
  SMTP_FROM_EMAIL: ""

  # Image worker (rotation, background removal)
  IMAGE_WORKER_CONCURRENCY: "1"
  MAX_IMAGE_MEGAPIXELS: "50"
  BG_REMOVAL_PROVIDER: "rembg"
  BG_REMOVAL_MODEL: "u2net"
  BG_REMOVAL_URL: ""
