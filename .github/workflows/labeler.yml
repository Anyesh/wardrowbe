name: Label PRs by changed path

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
